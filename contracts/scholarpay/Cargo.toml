[package]
name = "scholarpay"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib  → produces the .wasm artifact for Stellar deployment
# rlib    → required so `cargo test` can link a native test binary
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "22.0.0"

# Tests require a Linux/macOS native Soroban host environment.
[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# Pin ed25519-dalek to exactly 2.1.1.
# 2.1.1 satisfies soroban-env-host's ^2.1.1 constraint while preventing
# ed25519-dalek 3.0.0 (which has breaking trait changes) from being selected.
ed25519-dalek = "=2.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
