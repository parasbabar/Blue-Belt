name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-vercel:
    name: "Deploy to Vercel"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel secrets present - deployment will proceed."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing. Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub Secrets."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project for Vercel
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel production
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-soroban:
    name: "Deploy Soroban Contract (manual)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Soroban WASM
        run: |
          cargo build \
            --manifest-path contracts/scholarpay/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Check Stellar deployment secrets
        id: check-stellar-secrets
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "has_stellar_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Stellar secret key present - deployment will proceed."
          else
            echo "has_stellar_secrets=false" >> "$GITHUB_OUTPUT"
            echo "STELLAR_SECRET_KEY missing - Soroban deployment skipped."
          fi
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}

      - name: Install Stellar CLI
        if: steps.check-stellar-secrets.outputs.has_stellar_secrets == 'true'
        run: cargo install stellar-cli --features opt

      - name: Deploy Soroban contract to Testnet
        if: steps.check-stellar-secrets.outputs.has_stellar_secrets == 'true'
        run: |
          stellar contract deploy \
            --wasm contracts/scholarpay/target/wasm32-unknown-unknown/release/scholarpay.wasm \
            --source-account $STELLAR_ACCOUNT \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"
        env:
          STELLAR_ACCOUNT: ${{ secrets.STELLAR_SECRET_KEY }}